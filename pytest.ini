[pytest]
pythonpath = .
markers =
    smoke: Quick navigation / shell checks
    regression: Positive and negative module checks
    negative: Validation / rejection cases — reload the create form in place between tests
    e2e: End-to-end happy path across modules
    api: API tests, kept separate from the UI suite
testpaths =
    tests
    api/tests
addopts =
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --output=reports/test-results
    --html=reports/report.html
    --self-contained-html
